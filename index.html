<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thực hành Tạo Menu Ngang Dropdown</title>
    <style>
        /* Cố định phông chữ cho trang HTML và định dạng phân vùng cho trình đơn */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        #menu {
            height: 40px;
            border: 1px solid #ccc;
            background-color: #333;
            width: fit-content;
            border-radius: 4px;
        }

        #menu, #menu ul {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        /* Định nghĩa riêng cho các phần tử trong danh sách */
        #menu li {
            float: left;
            position: relative;
        }

        /* Định nghĩa cho các liên kết trong trình đơn */
        #menu a {
            display: block;
            width: 120px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
        }

        /* Chuyển màu nền của liên kết sang màu đỏ khi đưa con trỏ qua */
        #menu a:hover, #menu li:hover > a {
            background-color: #e74c3c;
        }

        /* Quy định vị trí hiển thị của danh sách con (trình đơn con) */
        #menu ul ul {
            position: absolute;
            top: 40px;
            left: 0;
            width: 120px;
            background-color: #333;
            visibility: hidden; /* Ẩn danh sách con mặc định */
        }

        #menu ul ul li {
            float: none;
        }

        /* Hiển thị trình đơn con khi đưa con trỏ qua mục chọn của trình đơn cha */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="menu">
        <ul>
            <li><a href="#">Trang Chủ</a></li>
            <li><a href="#">Sản Phẩm</a>
                <ul>
                    <li><a href="#">Điện Thoại</a></li>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Máy Tính Bảng</a></li>
                </ul>
            </li>
            <li><a href="#">Dịch Vụ</a>
                <ul>
                    <li><a href="#">Thiết Kế Web</a></li>
                    <li><a href="#">Lập Trình App</a></li>
                    <li><a href="#">SEO & Marketing</a></li>
                </ul>
            </li>
            <li><a href="#">Liên Hệ</a></li>
        </ul>
    </div>

</body>
</html>
